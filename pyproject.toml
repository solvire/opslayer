[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opslayer"
version = "0.1.0"
description = "Control layer for the dtac.io homelab: deploy, networking, monitoring, power, cluster, maintenance."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]
dev = ["pytest>=8.0", "detect-secrets>=1.5.0"]

[project.scripts]
opslayer = "opslayer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/opslayer"]
