# Gatus health dashboard - generated by opslayer monitor deploy.
# Placeholders are rendered from the operator's .env at deploy time.
# sqlite storage persists uptime history across restarts (the gatus service
# user owns /opt/gatus; the unit allows writes there). Set type: memory to
# revert to stateless.
metrics: false
storage:
  type: sqlite
  path: /opt/gatus/gatus.db
web:
  address: 0.0.0.0
  port: ${OPSLAYER_GATUS_PORT}
ui:
  title: Ops Monitor
  dashboard-heading: Cluster Health
  dark-mode: true
  default-sort-by: group
endpoints:
  # --- Cluster control plane -------------------------------------------------
  - name: argocd
    group: cluster
    url: "${OPSLAYER_ARGOCD_URL}"
    headers:
      Authorization: "Bearer ${OPSLAYER_ARGOCD_API_KEY}"
    interval: 60s
    conditions:
      - "[STATUS] < 500"
      - "[RESPONSE_TIME] < 5000"

  # --- Sites (generated from OPSLAYER_MONITOR_ENDPOINTS) ----------------------
[[ENDPOINTS]]

  # --- Power / UPS ------------------------------------------------------------
  - name: nut-server
    group: power
    url: "tcp://${OPSLAYER_NUT_SERVER}:3493"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"

  - name: ups
    group: power
    url: "http://${OPSLAYER_OPS_HOST}:${OPSLAYER_NUT_EXPORTER_PORT}/ups_metrics"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*network_ups_tools_ups_status*)"